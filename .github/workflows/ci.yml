name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Check synchronized version metadata
        run: python scripts/generate_version.py check

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install --yes doxygen

      - name: Build warning-clean public API documentation
        run: doxygen Doxyfile

      - name: Enforce core framework and timing guard
        run: python tools/check_core_timing_guard.py

      - name: Enforce Arduino CLI contract
        run: python tools/check_cli_contract.py

      - name: Enforce ESP-IDF example contract
        run: python tools/check_idf_example_contract.py

      - name: Test HIL runner parser helpers
        run: python tools/test_scd41_hil_runner.py

      - name: Exercise HIL runner no-hardware entry points
        run: |
          python tools/scd41_hil_runner.py --parser-self-test
          python tools/scd41_hil_runner.py --dry-run --port COM8 --output-dir hil-results

  native-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-6.1.19-native-${{ hashFiles('platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install platformio==6.1.19

      - name: Run native tests
        run: python -m platformio test -e native

      - name: Run native undefined-behavior sanitizer tests
        run: python -m platformio test -e native_ubsan

  platformio-build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        environment:
          - esp32s3dev
          - esp32s2dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-6.1.19-${{ matrix.environment }}-${{ hashFiles('platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install platformio==6.1.19

      - name: Build ${{ matrix.environment }}
        run: python -m platformio run -e ${{ matrix.environment }}

  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-6.1.19-package-${{ hashFiles('platformio.ini', 'library.json') }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install platformio==6.1.19

      - name: Check generated version header
        run: python scripts/generate_version.py check

      - name: Build package tarball
        run: |
          mkdir -p dist
          python -m platformio pkg pack . -o dist/SCD41-package.tar.gz

      - name: Verify package contents
        run: python tools/check_package_contents.py dist/*.tar.gz

      - name: Compile clean package consumer
        run: python tools/check_clean_consumer_compile.py dist/*.tar.gz

      - name: Build exact TunnelMonitor-node target package consumer
        run: python tools/check_target_package_consumer.py dist/*.tar.gz

  esp-idf-build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        idf_target:
          - esp32s3
          - esp32s2

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build ESP-IDF example for ${{ matrix.idf_target }}
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v6.0.1
          target: ${{ matrix.idf_target }}
          path: examples/idf/basic
          command: idf.py -B build-${{ matrix.idf_target }} build
